# UniFi Network on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=unifi
PKG_TITLE="UniFi Network"
PKG_DESC="The UniFi Network Application, the controller for UniFi access points, switches and gateways, in Container Manager with MongoDB — a community package, not made by Ubiquiti or Synology. A DSM window shows your devices, their firmware and clients, the address devices inform to and how to adopt them, which ports are used, UniFi's own backups beside consistent package backups, and memory settings for small NASes."
APP_ID="UniFiNetwork.AppInstance"
REPO=tombruton87/unifi-dsm
SERVICES="server db"
VOLUMES="config db"
IMAGE_VARS="UNIFI_IMAGE DB_IMAGE"
PORT=8443
PORTS="8443 8444 8445 9443"
HEALTH_PATH=/status
APP_ACTIONS="ports|informhost|memory|copyunf|adminpw|refreshcert"
APP_ANSWER_KEYS="INFORM_PORT STUN_PORT DISC_PORT ADMIN_USER ADMIN_EMAIL COUNTRY TLS JAVA_HEAP DB_CACHE"
APP_REQUEST_KEYS="INFORM_PORT STUN_PORT DISC_PORT PORTAL PORTAL_HTTP PORTAL_HTTPS INFORM_HOST JAVA_HEAP DB_CACHE ADMIN_ID TLS"
TAGLINE="network controller"
WELCOME="The UniFi Network Application is the controller for UniFi access points, switches and gateways: it adopts them, configures your Wi-Fi and networks, and keeps their firmware current. This package runs it with MongoDB in Container Manager, makes your administrator account, tells UniFi the address your devices should use, and adds a window to DSM for your devices, adopting new ones, backups and memory. It's a community package: neither Ubiquiti nor Synology made it."
BACKUP_WHAT="UniFi's database (a consistent MongoDB dump, taken with UniFi paused for a moment: sites, devices, Wi-Fi networks, settings, statistics) and its data folder (settings file, certificate, and UniFi's own autobackups)."
SITE_NOTE="The address you open UniFi Network at. UniFi always serves HTTPS on this port — with its own self-signed certificate, or with DSM's certificate (below). Devices don't use this address: they inform to the address on the Adopt tab."
ICON_TOP="#2b8cff"
ICON_BOTTOM="#0559c9"
ICON_LETTER="U"   # only if icon.png is missing
BETA=yes
